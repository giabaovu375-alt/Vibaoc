name: Build Release Binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - run: cargo install wasm-bindgen-cli
      - shell: bash
        run: bash scripts/build-runtime.sh
      - run: cargo build --release --target ${{ matrix.target }} -p vibaoc
      - shell: bash
        run: |
          mkdir -p release/vibao-0.1.0-${{ matrix.name }}
          cp target/${{ matrix.target }}/release/vibaoc* release/vibao-0.1.0-${{ matrix.name }}/ 2>/dev/null || true
          cp -r vibao-runtime/pkg release/vibao-0.1.0-${{ matrix.name }}/
          tar -czf vibao-0.1.0-${{ matrix.name }}.tar.gz -C release/vibao-0.1.0-${{ matrix.name }} .
      - uses: actions/upload-artifact@v4
        with:
          name: vibao-0.1.0-${{ matrix.name }}
          path: vibao-0.1.0-${{ matrix.name }}.tar.gz
